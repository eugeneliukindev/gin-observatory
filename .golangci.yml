version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - copyloopvar
    - errname
    - errorlint
    - exhaustive
    - gocritic
    - gosec
    - intrange
    - misspell
    - modernize
    - nilerr
    - noctx
    - perfsprint
    - revive
    - sloglint
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    errcheck:
      # Closing what was only read: there is nothing to do about an error there.
      exclude-functions:
        - (io.ReadCloser).Close
        - (*database/sql.Rows).Close

formatters:
  enable:
    - gci
    - gofumpt
  settings:
    gci:
      sections:
        - standard
        - default
        - localmodule
    gofumpt:
      # Without a dot in its first element the module reads as the standard library.
      module-path: go-observatory
